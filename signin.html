<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · StaffMatch</title>
  <meta name="description" content="Sign in to your StaffMatch pilot account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=14" />
</head>
<body class="page-pilot">
  <div class="app-shell">
    <header class="topbar">
      <a class="wordmark" href="index.html">StaffMatch</a>
      <a class="btn ghost" href="pilot.html">Try the free pilot</a>
    </header>
    <main>
      <section class="panel" id="auth-panel">
        <p class="eyebrow">Account</p>
        <h1>Sign in</h1>
        <p class="muted">Use the email and password for your account.</p>

        <div id="form-status" class="form-status" hidden></div>

        <form class="pilot-form" id="signin-form" novalidate>
          <label class="field">
            <span class="field-label">Email <span class="req">*</span></span>
            <input type="email" name="email" required autocomplete="username" placeholder="you@firm.com" />
          </label>

          <label class="field">
            <span class="field-label">Password <span class="req">*</span></span>
            <div class="password-wrap">
              <input type="password" name="password" required minlength="8" autocomplete="current-password" />
              <button type="button" class="toggle-pass" data-toggle-password aria-label="Show password" aria-pressed="false">Show</button>
            </div>
          </label>

          <div class="form-actions">
            <a class="btn ghost" href="index.html">Cancel</a>
            <button type="submit" class="btn primary" id="signin-submit">Sign in</button>
          </div>

          <p class="tiny">No account yet? <a href="pilot.html">Start the free pilot</a></p>
        </form>
      </section>
    </main>
    <footer class="site-foot inset">
      <span>Independent product — not tied to any employer.</span>
      <a href="mailto:staffmatch.support@gmail.com?subject=StaffMatch%20inquiry">Inquiries</a>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      var auth = window.StaffMatchAuth;
      var panel = document.getElementById('auth-panel');
      var form = document.getElementById('signin-form');
      var statusEl = document.getElementById('form-status');
      var submitBtn = document.getElementById('signin-submit');
      var readyCopy = "You're signed in.";

      auth.bindPasswordToggles(form);

      function wireForm() {
        form.addEventListener('submit', function (event) {
          event.preventDefault();
          auth.setStatus(statusEl);

          var email = (form.email.value || '').trim();
          var password = form.password.value || '';

          if (!email || !form.email.checkValidity()) {
            auth.setStatus(statusEl, 'error', 'A valid email is required.');
            form.email.focus();
            return;
          }
          if (password.length < 8) {
            auth.setStatus(statusEl, 'error', 'Password must be at least 8 characters.');
            form.password.focus();
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Signing in…';

          auth.signIn({ email: email, password: password })
            .then(function () {
              if (auth.redirectToAppIfConfigured()) return;
              auth.showReadyState(panel, { title: "You're in", body: readyCopy });
            })
            .catch(function (err) {
              auth.setStatus(statusEl, 'error', err.message || "Couldn't sign you in.");
              submitBtn.disabled = false;
              submitBtn.textContent = 'Sign in';
            });
        });
      }

      auth.refreshSession().then(function () {
        if (auth.hasSession()) {
          if (auth.redirectToAppIfConfigured()) return;
          auth.showReadyState(panel, { title: "You're in", body: readyCopy });
          return;
        }
        if (!auth.isConfigured()) {
          auth.setStatus(statusEl, 'info', auth.NOT_CONFIGURED);
        }
        wireForm();
      });
    })();
  </script>
</body>
</html>
